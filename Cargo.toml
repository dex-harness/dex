[workspace]
resolver = "2"
members = ["crates/dex-protocol", "crates/dex-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dex-protocol = { path = "crates/dex-protocol", version = "0.1.0" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
globset = "0.4"
ignore = "0.4"
postcard = { version = "1", features = ["use-std"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
rune = { version = "0.14", features = ["disable-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "process",
    "sync",
    "time",
    "signal",
    "fs",
] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
# Keeps rebuilds of the Rune dependency tree tolerable during iteration.
debug = 0
